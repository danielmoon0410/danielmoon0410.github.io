<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문다니엘 · Daniel Moon</title>
<meta name="description" content="AI Hardware Researcher — computer architecture, FPGA-based AI accelerators and NPU design, bridging neural-network algorithms and silicon-level optimization.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<script type="module" src="src/main.js"></script>
</head>
<body>
<button id="skip-2d" type="button"></button>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="loader" role="status" aria-live="polite">
  <p class="loader-name"></p>
  <progress id="loader-bar" max="100" value="0"></progress>
  <span id="loader-pct"></span>
  <button id="start-btn" type="button" disabled></button>
</div>
<div id="hint" hidden></div>
<canvas id="minimap" hidden aria-hidden="true"></canvas>
<button id="prompt" type="button" hidden></button>
<div id="touch-controls" hidden aria-hidden="true">
  <button id="tc-left" type="button" tabindex="-1">&#9664;</button>
  <button id="tc-right" type="button" tabindex="-1">&#9654;</button>
  <button id="tc-rev" type="button" tabindex="-1">&#9660;</button>
  <button id="tc-gas" type="button" tabindex="-1">&#9650;</button>
</div>
<section id="panel" role="dialog" aria-labelledby="panel-title" tabindex="-1" hidden>
  <p class="eyebrow" id="panel-eyebrow"></p>
  <h2 id="panel-title"></h2>
  <button id="panel-close" type="button" aria-label="">&#215;</button>
  <div id="panel-body"></div>
</section>
<section id="view-2d" aria-labelledby="view-2d-title" tabindex="-1" hidden></section>
<div id="error-log" hidden></div>
</body>
</html>
